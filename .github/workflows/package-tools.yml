name: Package tool print files

# On every push to main, detect which top-level tool directories changed and
# (re)package each changed tool into its own rolling release (tag = tool name):
#   <Tool>-print-files.zip  <- <Tool>/Print Files/
#   <Tool>-step-files.zip   <- <Tool>/CAD/*.step (when the tool has any)
# Zip names stay fixed so the website can link to releases/download/<Tool>/<name>.zip;
# VERSION.txt inside each zip records the commit it was built from.
on:
  push:
    branches: [main]
  workflow_dispatch: {}  # manual run repackages every module

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      # LFS files are pulled per tool below: only what goes into the zips
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed modules
        id: changed
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            # First push / new branch / unavailable base: diff against the empty tree so every module is packaged.
            base="$(git hash-object -t tree /dev/null)"
          else
            base="$before"
          fi
          diff_range="$base ${{ github.sha }}"
          echo "Diffing: $diff_range"

          # Top-level dir of each changed path, excluding infra dirs and root-level files.
          modules="$(git diff --name-only $diff_range \
            | awk -F/ 'NF>1 {print $1}' \
            | grep -vE '^\.(git|github)$' \
            | sort -u || true)"

          # Keep only dirs that still exist and actually contain print files.
          kept=""
          while IFS= read -r m; do
            [ -z "$m" ] && continue
            if [ -d "$m/Print Files" ]; then
              kept="$kept$m"$'\n'
            fi
          done <<< "$modules"

          echo "Changed modules:"
          printf '%s' "$kept"
          {
            echo "modules<<EOF"
            printf '%s' "$kept"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Package and publish releases
        if: steps.changed.outputs.modules != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while IFS= read -r module; do
            [ -z "$module" ] && continue
            echo "::group::Packaging $module"
            git lfs pull --include="$module/Print Files/**,$module/CAD/*.step"
            if grep -rlI "^version https://git-lfs.github.com/spec/v1" "$module/Print Files" "$module/CAD" 2>/dev/null; then
              echo "::error::Files above are still LFS pointers"
              exit 1
            fi
            echo "$module $(git rev-parse --short HEAD) $(date -u +%Y-%m-%d)" > VERSION.txt

            assets=("${module}-print-files.zip")
            (cd "$module" && zip -r "../${module}-print-files.zip" "Print Files")
            zip -j "${module}-print-files.zip" VERSION.txt
            shopt -s nullglob
            steps=("$module"/CAD/*.step)
            shopt -u nullglob
            if [ ${#steps[@]} -gt 0 ]; then
              zip -j "${module}-step-files.zip" "${steps[@]}" VERSION.txt
              assets+=("${module}-step-files.zip")
            fi

            tag="$module"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Updating existing release $tag"
              gh release upload "$tag" "${assets[@]}" --clobber
            else
              echo "Creating release $tag"
              gh release create "$tag" "${assets[@]}" \
                --title "$module" \
                --notes "Latest print files (and assembled STEP, where provided) for **$module**. This release is updated automatically whenever the \`$module/\` directory changes."
            fi
            rm -f "${module}"-*.zip VERSION.txt
            echo "::endgroup::"
          done <<< "${{ steps.changed.outputs.modules }}"
